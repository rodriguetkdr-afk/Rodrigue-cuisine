<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<title>Maison Cuisine</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
--bg:#0B0B0B;
--card:rgba(26,26,26,.72);
--gold:#C9A86A;
--text:#F5F2EA;
--muted:#A8A29A;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
background:
radial-gradient(circle at top,#242018 0%,#0B0B0B 40%),
linear-gradient(#0B0B0B,#080808);
color:var(--text);
font-family:Inter,sans-serif;
min-height:100vh;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 0%,rgba(201,168,106,.08),transparent 35%),
radial-gradient(circle at 80% 30%,rgba(201,168,106,.05),transparent 30%);
pointer-events:none;
}

header{
position:sticky;
top:0;
z-index:50;
padding:28px 22px 18px;
padding-top:calc(28px + env(safe-area-inset-top));
backdrop-filter:blur(28px);
background:rgba(11,11,11,.65);
}

header small{
color:var(--gold);
letter-spacing:4px;
text-transform:uppercase;
font-size:11px;
display:block;
margin-bottom:6px;
}

h1{
font-family:"Cormorant Garamond",serif;
font-size:46px;
margin-bottom:18px;
}

.searchBox{position:relative;}

.searchBox input{
width:100%;
padding:16px 18px 16px 50px;
background:rgba(255,255,255,.05);
border:1px solid rgba(201,168,106,.12);
border-radius:22px;
color:white;
font-size:15px;
outline:none;
}

.searchIcon{
position:absolute;
left:18px;
top:50%;
transform:translateY(-50%);
color:var(--gold);
font-size:18px;
}

.categories{
display:flex;
gap:12px;
padding:18px 20px;
overflow:auto;
scrollbar-width:none;
}

.categories::-webkit-scrollbar{display:none;}

.categories button{
padding:11px 18px;
border-radius:999px;
border:none;
background:rgba(255,255,255,.04);
color:var(--muted);
cursor:pointer;
}

.categories button.active{
background:var(--gold);
color:#111;
font-weight:600;
}

#recipes{
padding:18px;
display:grid;
gap:22px;
}

.card{
background:var(--card);
backdrop-filter:blur(26px);
border-radius:32px;
padding:24px;
box-shadow:0 25px 60px rgba(0,0,0,.45);
}

.card h2{
font-family:"Cormorant Garamond",serif;
font-size:34px;
margin-bottom:12px;
}

.badges{
display:flex;
gap:10px;
margin-bottom:18px;
flex-wrap:wrap;
}

.badge{
padding:7px 12px;
border-radius:999px;
background:rgba(201,168,106,.08);
color:var(--gold);
font-size:12px;
}

.ingredients{
margin:16px 0;
padding:16px;
background:rgba(255,255,255,.03);
border-radius:18px;
}

.ingredients strong{
display:block;
margin-bottom:8px;
color:var(--gold);
}

.steps{
display:grid;
gap:12px;
margin-top:18px;
}

.step{
display:flex;
gap:12px;
align-items:flex-start;
}

.number{
width:28px;
height:28px;
border-radius:50%;
background:rgba(201,168,106,.12);
display:flex;
align-items:center;
justify-content:center;
color:var(--gold);
flex-shrink:0;
}

.timer{
margin-top:22px;
padding:18px;
border-radius:20px;
background:rgba(255,255,255,.03);
display:flex;
justify-content:space-between;
align-items:center;
}

.timer button{
background:linear-gradient(135deg,#D7B87A,#B9924F);
color:#111;
border:none;
padding:12px 18px;
border-radius:14px;
font-weight:600;
cursor:pointer;
}

footer{
padding:40px;
text-align:center;
color:#666;
}

#addBtn{
position:fixed;
right:22px;
bottom:30px;
width:66px;
height:66px;
border-radius:50%;
border:none;
font-size:34px;
background:linear-gradient(135deg,#D7B87A,#B9924F);
color:#111;
box-shadow:0 15px 40px rgba(201,168,106,.35);
cursor:pointer;
z-index:200;
}

#modal,.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.78);
backdrop-filter:blur(12px);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
z-index:999;
}

.hidden{
display:none !important;
}

.modalCard,.popupCard{
width:100%;
max-width:420px;
background:rgba(24,24,24,.95);
border-radius:28px;
padding:24px;
display:grid;
gap:14px;
}

.modalCard input,
.modalCard textarea{
background:#1E1E1E;
border:1px solid rgba(201,168,106,.15);
color:white;
padding:14px;
border-radius:14px;
font-size:15px;
outline:none;
}

.modalCard textarea{
min-height:100px;
resize:vertical;
}

.actions{
display:flex;
gap:10px;
}

.actions button{
flex:1;
padding:12px;
border:none;
border-radius:14px;
cursor:pointer;
}

.actions button:last-child{
background:linear-gradient(135deg,#D7B87A,#B9924F);
color:#111;
font-weight:600;
}

.popupCard{
text-align:center;
}

.popupCard h1{
font-size:56px;
}

.popupCard button{
margin-top:15px;
padding:12px;
border:none;
border-radius:14px;
background:var(--gold);
}

</style>
</head>

<body>

<header>
<small>Maison Privée</small>
<h1>Maison Cuisine</h1>

<div class="searchBox">
<div class="searchIcon">⌕</div>
<input id="search" placeholder="Rechercher une préparation...">
</div>
</header>

<div class="categories" id="categories"></div>

<div id="recipes"></div>

<footer>Collection personnelle • Chef Edition</footer>

<button id="addBtn">+</button>

<div id="modal" class="hidden">
<div class="modalCard">
<h2>Nouvelle recette</h2>

<input id="titleInput" placeholder="Nom">

<input id="categoryInput" placeholder="Catégorie">

<input id="timeInput" placeholder="Temps (ex: 12 min)">

<textarea id="ingredientsInput" placeholder="Un ingrédient par ligne"></textarea>

<textarea id="stepsInput" placeholder="Une étape par ligne"></textarea>

<div class="actions">
<button onclick="closeModal()">Annuler</button>
<button onclick="saveRecipe()">Enregistrer</button>
</div>

</div>
</div>

<script>

const defaultRecipes=[

{
title:"Steak",
category:"Viande",
time:"8 min",
ingredients:["Steak","Beurre","Ail","Thym"],
steps:[
"Sortir la viande 30 min avant.",
"Poêle très chaude.",
"Saisir 2 à 3 min par face.",
"Ajouter beurre, ail et thym.",
"Arroser avec le beurre.",
"Laisser reposer 5 min."
]
},

{
title:"Purée",
category:"Base",
time:"25 min",
ingredients:["Pommes de terre","Beurre","Lait chaud","Sel"],
steps:[
"Cuire les pommes de terre.",
"Les écraser.",
"Ajouter le beurre.",
"Ajouter progressivement le lait chaud.",
"Assaisonner."
]
},

{
title:"Canard",
category:"Viande",
time:"12 min",
ingredients:["Magret de canard","Sel","Poivre"],
steps:[
"Quadriller la peau.",
"Cuire côté peau 8 min.",
"Retourner 2 min.",
"Repos 5 min."
]
},

{
title:"Sauce au poivre",
category:"Sauce",
time:"10 min",
ingredients:["Échalote","Poivre","Crème","Fond de veau"],
steps:[
"Faire revenir l'échalote.",
"Ajouter le poivre.",
"Déglacer.",
"Ajouter la crème."
]
},

{
title:"Saumon",
category:"Poisson",
time:"10 min",
ingredients:["Saumon","Beurre","Citron"],
steps:[
"Côté peau 7 min.",
"Retourner 2 min.",
"Servir avec citron."
]
}

];

let recipes=JSON.parse(localStorage.getItem("mes_recettes"))||defaultRecipes;

const recipesContainer=document.getElementById("recipes");
const search=document.getElementById("search");
const categories=document.getElementById("categories");
const modal=document.getElementById("modal");

let currentCategory="Tous";

function buildCategories(){

const list=["Tous",...new Set(recipes.map(r=>r.category))];

categories.innerHTML="";

list.forEach(cat=>{

const b=document.createElement("button");

b.textContent=cat;

if(cat===currentCategory)b.classList.add("active");

b.onclick=()=>{

currentCategory=cat;
buildCategories();
display();

};

categories.appendChild(b);

});

}

function display(){

const value=search.value.toLowerCase();

recipesContainer.innerHTML="";

recipes.filter(r=>

(currentCategory==="Tous"||r.category===currentCategory)

&&

(r.title.toLowerCase().includes(value)||r.category.toLowerCase().includes(value))

).forEach(r=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<h2>${r.title}</h2>

<div class="badges">
<div class="badge">${r.category}</div>
<div class="badge">${r.time}</div>
</div>

<div class="ingredients">
<strong>Ingrédients</strong>
${r.ingredients.join(" • ")}
</div>

<div class="steps">
${r.steps.map((s,i)=>`
<div class="step">
<div class="number">${i+1}</div>
<div>${s}</div>
</div>
`).join("")}
</div>

<div class="timer">
<div>${r.time}</div>
<button onclick="startTimer('${r.time}')">Lancer</button>
</div>

`;

recipesContainer.appendChild(card);

});

}

search.addEventListener("input",display);

document.getElementById("addBtn").onclick=()=>modal.classList.remove("hidden");

function closeModal(){

modal.classList.add("hidden");

}

function saveRecipe(){

const recipe={

title:titleInput.value,
category:categoryInput.value,
time:timeInput.value,

ingredients:ingredientsInput.value.split("\n").filter(i=>i.trim()),

steps:stepsInput.value.split("\n").filter(i=>i.trim())

};

if(!recipe.title)return;

recipes.unshift(recipe);

localStorage.setItem("mes_recettes",JSON.stringify(recipes));

titleInput.value="";
categoryInput.value="";
timeInput.value="";
ingredientsInput.value="";
stepsInput.value="";

closeModal();

buildCategories();
display();

}

function startTimer(text){

let sec=parseInt(text)*60;

const popup=document.createElement("div");

popup.className="popup";

popup.innerHTML=`

<div class="popupCard">

<div style="font-size:34px;color:#C9A86A;">✦</div>

<h1 id="count"></h1>

<p>Cuisson en cours</p>

<button>Fermer</button>

</div>

`;

document.body.appendChild(popup);

const count=popup.querySelector("#count");

function update(){

count.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;

if(sec===0){

clearInterval(interval);

count.textContent="Prêt";

if(navigator.vibrate)navigator.vibrate(300);

}

sec--;

}

update();

const interval=setInterval(update,1000);

popup.querySelector("button").onclick=()=>{

clearInterval(interval);

popup.remove();

};

}

buildCategories();
display();

</script>

</body>
</html>
